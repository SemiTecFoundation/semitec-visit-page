<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="description" content="SemiTec Foundation — read the page with an interactive chip map, or travel through the chip in 3D. One structure, two views.">
  <title>SemiTec Foundation</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath fill='%23071419' d='M0 0h40v40H0z'/%3E%3Cpath fill='none' stroke='%23eac883' stroke-width='2' d='m5 29 12-20 6 10 4-6 9 16H5Z'/%3E%3C/svg%3E">
  <!-- The view is chosen before first paint: ?mode=2d|3d, else the last one used, else 2D. -->
  <script>
    (function(){var m=new URLSearchParams(location.search).get('mode');try{m=m||localStorage.getItem('st-mode')}catch(e){}
    document.documentElement.dataset.mode=(m==='3d')?'3d':'2d';})();
  </script>
  <link rel="stylesheet" href="css/base.css?v=s2610310016">
  <link rel="stylesheet" href="css/read.css?v=s2610310016">
  <link rel="stylesheet" href="css/signal.css?v=s2610310016">
  <script src="content.js?v=s2610310016" defer></script>
  <script src="js/journey.js?v=s2610310016" defer></script>
  <script src="js/scene.js?v=s2610310016" defer></script>
  <script src="js/core.js?v=s2610310016" defer></script>
  <script src="js/sound.js?v=s2610310016" defer></script>
  <script src="js/chiplayout.js?v=s2610310016" defer></script>
  <script src="js/chipmap.js?v=s2610310016" defer></script>
  <script src="js/ecosystem.js?v=s2610310016" defer></script>
  <script src="js/story.js?v=s2610310016" defer></script>
  <script src="js/mode-read.js?v=s2610310016" defer></script>
  <script src="js/mode-signal.js?v=s2610310016" defer></script>
</head>
<body>
  <a class="skip" href="#main" data-ui="skip"></a>

  <!-- ===== 3D view layers (the Signal journey) ===== -->
  <canvas id="chip-scene" aria-hidden="true"></canvas>
  <div class="scene-shade" aria-hidden="true"></div>

  <!-- ===== Shared header ===== -->
  <header class="header">
    <a class="brand" href="#overview"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 29 17 9l6 10 4-6 9 16H5Z"/><path d="m12 29 7-11 6 11"/></svg><span id="brand-name"></span></a>
    <div class="header-center"><i class="status-light"></i><span id="brand-tagline"></span></div>
    <div class="header-tools">
      <div class="mode-switch" role="group" data-ui-label="modeGroup">
        <button type="button" data-mode="2d" aria-pressed="false"><span class="ms-icon ms-2d" aria-hidden="true"></span><b>2D</b><span class="ms-word" data-ui="mode2d"></span></button>
        <button type="button" data-mode="3d" aria-pressed="false"><span class="ms-icon ms-3d" aria-hidden="true"></span><b>3D</b><span class="ms-word" data-ui="mode3d"></span></button>
        <i class="ms-thumb" aria-hidden="true"></i>
      </div>
      <button type="button" id="map-toggle" class="text-button" aria-haspopup="dialog" data-ui="map"></button>
      <button type="button" id="sound-toggle" class="sound-toggle" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="spk" d="M3 8h3l4-3v10l-4-3H3z"/><path class="sw sw1" d="M13 7.5a3.5 3.5 0 0 1 0 5"/><path class="sw sw2" d="M15.5 5.2a7 7 0 0 1 0 9.6"/><path class="sx" d="M13.2 8.2l3.6 3.6M16.8 8.2l-3.6 3.6"/></svg></button>
      <div class="languages" role="group"><button type="button" data-lang="en" aria-pressed="true">EN</button><span>/</span><button type="button" data-lang="hy" aria-pressed="false">ՀԱՅ</button></div>
      <button type="button" id="motion-toggle" class="motion-toggle" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5v10M14 5v10"/></svg><span></span></button>
    </div>
    <div class="progress" aria-hidden="true"><i id="progress-bar"></i></div>
  </header>

  <main id="main" tabindex="-1">
    <!-- 3D view: reading panel and projected boards over the WebGL chip -->
    <div class="experience">
      <aside id="reading-panel" class="reading-panel" tabindex="-1"></aside>
      <div id="scene-media" class="scene-media"></div>
      <div id="branch-entrances" class="branch-entrances"></div>
      <div id="finale-pads" class="finale-pads" aria-label="Partners and supporters"></div>
      <div id="event-layer" class="event-layer" aria-label="Upcoming events and memory"></div>
      <!-- the ending after the chip edge: zoom out, the package, the ecosystem (js/ecosystem.js) -->
      <div id="eco-3d" class="eco-3d"></div>
      <!-- the opening story before the journey (js/story.js) -->
      <div id="intro-3d" class="intro-3d"></div>
      <div class="travel-status"><div><i class="status-light"></i><span id="travel-label" data-ui="inside"></span></div><span id="journey-percent">000%</span><div class="travel-line"><span id="travel-fill"></span></div></div>
      <div class="scroll-cue"><span class="scroll-icon" aria-hidden="true">↓</span><span id="scroll-hint"></span><span class="key-hint" data-ui="spaceHint"></span></div>
    </div>
    <div id="scroll-track" aria-hidden="true"></div>

    <!-- 2D view: interactive chip map + the readable page -->
    <div class="read">
      <!-- one column first: the overview and "two ways to explore" -->
      <div id="read-intro" class="read-intro"></div>
      <!-- then the page splits: the map docks on the left, sections read on the right -->
      <div class="read-grid"><div class="map-space" aria-hidden="true"></div><div id="read-sections" class="sections"></div></div>
      <!-- the ending: the map closes into its package, then zooms out to the ecosystem -->
      <div id="read-outro" class="outro"></div>
      <aside class="map-dock"><div id="chipmap"></div></aside>
    </div>
    <footer class="site-foot"><span><b>SemiTec Foundation</b> · <span data-ui="footerLine"></span> · <a href="https://semitecfoundation.github.io/semitec-academy/" target="_blank" rel="noopener" data-ui="academyLink"></a></span><span data-ui="prototype"></span></footer>
    <noscript><section class="no-script"><h1>SemiTec Foundation</h1><p>Enable JavaScript to explore this prototype. Sections: Purpose, Focus, Initiatives, Events, Impact, People, Trust and Connect.</p></section></noscript>
  </main>

  <!-- ===== Shared bottom section bar ===== -->
  <nav class="chapter-nav"><a href="#overview" class="start-link"><span aria-hidden="true">◉</span></a><div id="chapter-links"></div><span class="nav-count" id="nav-count">00 / 08</span></nav>

  <dialog id="route-map" class="route-map" aria-labelledby="map-title"><div class="map-header"><h2 id="map-title" data-ui="mapTitle"></h2><button id="map-close" type="button">×</button></div><p class="map-intro" data-ui="mapIntro"></p><div id="map-tree"></div><p class="map-footer" data-ui="prototype"></p></dialog>
  <dialog id="memory-dialog" class="route-map memory-dialog" aria-labelledby="memory-title"><div class="map-header"><h2 id="memory-title"></h2><button id="memory-close" type="button" aria-label="Close">×</button></div><div id="memory-banks" class="memory-banks" role="group"></div><p class="map-intro"></p><div id="memory-grid"></div><p class="map-footer" data-ui="exampleNote"></p></dialog>
  <dialog id="media-dialog" class="media-dialog" aria-labelledby="media-title"><button id="media-close" type="button">×</button><img id="media-large" src="assets/wafer.svg" alt=""><h2 id="media-title"></h2><p id="media-caption"></p></dialog>
  <p id="route-announcement" class="sr-only" role="status" aria-live="polite"></p>
  <div class="mode-veil" aria-hidden="true"></div>
</body>
</html>
